   <main class="contact-main">
      <div class="mainvisual">
        <div class="contact-titles">
          <h3>お問い合わせ</h3>
          <p>小さな補修からリフォームまで<br />お気軽にご相談ください</p>
        </div>
      </div>

      <section class="contact">
        <div class="wrapper">
          <h3>お問い合わせフォーム</h3>

          <form action="#">
            <div class="form-item">
              <label for="case">件名</label>
              <input type="text" id="case" name="your-case" />
            </div>

            <div class="form-item">
              <label for="name">お名前</label>
               <input type="text" id="name" name="your-name" />
            </div>

            <div class="form-item">
              <label for="tel-number">電話番号</label>
              <input type="tel" id="tel-number" name="your-tel-number" />
            </div>

            <div class="form-item">
              <label for="email">メールアドレス</label>
              <input type="email" id="email" name="your-email"/>
            </div>

            <div class="form-item">
              <label for="message">お問い合わせ内容</label>
              <textarea id="message" name="your-message"></textarea>
            </div>

            <div class="submit-btn">
              <input type="submit" value="送信" />
            </div>
          </form>
        </div>
      </section>
    </main>
